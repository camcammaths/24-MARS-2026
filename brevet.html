<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ton brevet — Prépa Brevet</title>
<style>
:root {
  --blue:#0021BC;--blue-lt:#BDD4E7;--orange:#EE6E34;--rose:#D0A6C6;
  --bg:#EDEEF0;--white:#FFFFFF;--ink:rgb(25,8,6);--muted:#8A8DAA;
  --fd:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  --fb:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased}
.nav{display:flex;justify-content:space-between;align-items:flex-start;padding:28px 48px 0}
.logo{cursor:pointer;text-decoration:none;color:inherit}
.logo-top{font-size:13px;color:var(--ink);display:block}
.logo-bot{font-family:var(--fd);font-size:36px;font-weight:800;letter-spacing:-.04em;line-height:.9;text-transform:uppercase;display:block}
.logo-bot span{color:var(--blue)}
.nav-r{display:flex;align-items:center;gap:32px}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links li{font-size:14px;opacity:.6;cursor:pointer}
.nav-links li a{text-decoration:none;color:inherit}
.cta{font-family:var(--fd);font-size:13px;font-weight:600;background:var(--blue);color:#fff;padding:11px 24px;border-radius:100px;border:none;cursor:pointer;text-decoration:none;display:inline-block}
.divider{height:1px;background:rgba(0,0,0,.1);margin:0 48px}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:20px;height:2px;background:var(--orange);border-radius:2px;display:inline-block}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-size:13px;font-weight:600;padding:13px 28px;border-radius:100px;cursor:pointer;border:none;text-transform:lowercase;text-decoration:none}
.btn-blue{background:var(--blue);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid rgba(0,0,0,.15);padding:12px 26px}
.ctag{font-size:10px;font-weight:500;padding:4px 12px;border-radius:100px;border:1.5px solid rgba(0,0,0,.1);color:var(--muted)}
.ctag.b{background:#EEF2FF;border-color:var(--blue);color:var(--blue)}
/* ── Exercices ── */
.brevet-ex{background:var(--white);border-radius:18px;padding:32px;margin-bottom:14px}
.brevet-ex-num{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.brevet-ex-titre{font-family:var(--fd);font-size:20px;font-weight:500;text-transform:lowercase;letter-spacing:-.02em;display:block}
.brevet-enonce{font-size:14px;line-height:1.75;color:#3A3D6B;background:rgba(0,33,188,.03);border-left:3px solid var(--blue-lt);padding:14px 18px;border-radius:0 10px 10px 0;margin:18px 0 22px}
.brevet-q{margin-bottom:20px}
.brevet-q-row{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.brevet-q-id{font-family:var(--fd);font-size:13px;font-weight:700;color:var(--blue);flex-shrink:0}
.brevet-q-text{font-size:14px;color:var(--ink);line-height:1.5;flex:1}
.brevet-q-pts{font-size:11px;font-weight:700;color:var(--orange);background:#FFF0E8;padding:3px 10px;border-radius:100px;white-space:nowrap}
.brevet-answer{width:100%;font-family:var(--fb);font-size:14px;color:var(--ink);background:#FAFAFA;border:1.5px solid rgba(0,0,0,.08);border-radius:10px;padding:12px 14px;resize:vertical;line-height:1.6}
.brevet-answer:focus{outline:none;border-color:var(--blue);background:var(--white)}
.brevet-answer::placeholder{color:var(--muted)}
.lbl{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block}
.aff-block{background:#FAFAFA;border:1.5px solid rgba(0,0,0,.07);border-radius:12px;padding:16px 20px;margin-bottom:10px}
.partie-label{display:block;margin:18px 0 10px;padding:8px 14px;background:rgba(0,33,188,.06);border-radius:8px;border-left:3px solid var(--blue);font-weight:700;font-size:13px;color:var(--blue);letter-spacing:.03em;text-transform:uppercase}
.partie-label.orange{background:rgba(238,110,52,.06);border-color:var(--orange);color:var(--orange)}
.brevet-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--white);border-radius:10px;overflow:hidden;border:1.5px solid rgba(0,0,0,.08);margin:12px 0}
.brevet-table th{background:#EEF2FF;padding:10px 14px;text-align:center;font-weight:700;color:var(--blue);border-right:1px solid rgba(0,33,188,.1);font-size:12px}
.brevet-table td{padding:11px 14px;text-align:center;border-right:1px solid rgba(0,0,0,.06);font-size:12px}
.brevet-figure{display:flex;justify-content:center;margin:16px 0;background:#FAFAFA;border-radius:14px;padding:20px;border:1.5px solid rgba(0,0,0,.06)}
/* ── Correction ── */
.corr-btn{font-family:var(--fd);font-size:12px;font-weight:600;padding:8px 20px;border-radius:100px;border:1.5px solid rgba(0,0,0,.1);background:transparent;color:var(--blue);cursor:pointer;margin-top:8px;transition:all .15s}
.corr-btn:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.corr-btn:disabled{opacity:.35;cursor:not-allowed}
.q-feedback{margin-top:10px;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.6;display:none}
.q-feedback.shown{display:block;background:#EEF2FF;border:1.5px solid var(--blue-lt);color:#1e3a8a}
/* ── Score ── */
.score-panel{background:var(--blue);border-radius:18px;padding:32px;margin-top:24px;display:none}
.score-panel-inner{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.score-note{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:8px}
.score-big{font-family:var(--fd);font-size:64px;font-weight:700;color:#fff;letter-spacing:-.04em;line-height:1;margin-bottom:16px}
.score-mention{display:inline-block;font-size:12px;font-weight:700;padding:6px 18px;border-radius:100px}
.score-bars{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.score-ex-row{display:flex;align-items:center;gap:10px}
.score-ex-name{font-size:11px;color:rgba(255,255,255,.6);width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-ex-bar{flex:1;height:6px;background:rgba(255,255,255,.15);border-radius:100px;overflow:hidden}
.score-ex-fill{height:100%;background:rgba(255,255,255,.7);border-radius:100px}
.score-ex-pts{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);width:40px;text-align:right}
.ex-score-bar{margin-top:16px;padding:12px 16px;background:#FAFAFA;border-radius:10px;border:1.5px solid rgba(0,0,0,.07)}
.ex-score-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px}
.ex-score-label{color:var(--muted);font-weight:500}
.ex-score-val{font-weight:700;color:var(--blue)}
.ex-bar{height:6px;background:rgba(0,0,0,.08);border-radius:100px;overflow:hidden}
.ex-bar-fill{height:100%;background:var(--blue);border-radius:100px;transition:width .4s}
.qcm-options{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.qcm-btn{padding:12px;border:1.5px solid rgba(0,0,0,.08);border-radius:10px;background:#FAFAFA;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .15s;font-family:var(--fb)}
.qcm-btn:hover{border-color:var(--blue)}
.qcm-btn.selected{background:#EEF2FF;border-color:var(--blue)}
.qcm-btn-letter{font-size:10px;font-weight:700;color:var(--blue)}
.qcm-btn-label{font-size:13px;font-weight:600;text-align:center}
.footer-bar{background:var(--blue);padding:16px 48px;display:flex;justify-content:space-between;align-items:center}
.footer-bar-links{display:flex;gap:40px}
.footer-bar-links a{font-size:13px;font-weight:500;color:rgba(255,255,255,.7);text-decoration:none}
.footer-bar-copy{font-size:12px;color:rgba(255,255,255,.35)}
@media(max-width:600px){
  .nav{padding:20px 20px 0}.divider{margin:0 20px}
  div[style*="padding:36px 48px"]{padding:24px 20px !important}
  .score-panel-inner{grid-template-columns:1fr}
  .qcm-options{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo">
    <span class="logo-top">prépa</span>
    <span class="logo-bot">bre<span>.</span>vet</span>
  </a>
  <div class="nav-r">
    <ul class="nav-links">
      <li><a href="index.html">accueil</a></li>
      <li><a href="parcours.html">mon parcours</a></li>
      <li><a href="planning.html">planning</a></li>
      <li><a href="ressources.html">ressources</a></li>
      <li style="color:var(--orange);opacity:1;font-weight:600"><a href="abonnement.html">s'inscrire ✦</a></li>
    </ul>
    <a class="cta" href="generer.html">générer un brevet →</a>
  </div>
</nav>

<div class="divider" style="margin-top:16px"></div>

<div style="padding:36px 48px 28px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px">
  <div>
    <p class="eyebrow" style="margin-bottom:10px">Brevet généré · Mathématiques</p>
    <h1 style="font-family:var(--fd);font-size:clamp(32px,3.8vw,56px);font-weight:500;line-height:1;letter-spacing:-.04em;text-transform:lowercase;margin-bottom:8px">ton brevet<br><span style="color:var(--blue)">personnalisé.</span></h1>
    <p style="font-size:13px;color:var(--muted);font-weight:300">Durée : <strong id="brevet-duree" style="color:var(--ink)">2h</strong> · <span id="brevet-notions" style="color:var(--ink)"></span></p>
  </div>
  <div style="background:var(--white);border-radius:18px;padding:20px 28px;text-align:center;min-width:180px">
    <div style="font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">temps restant</div>
    <div id="timer-display" style="font-family:var(--fd);font-size:42px;font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums">02:00:00</div>
    <div style="margin-top:12px;display:flex;gap:6px;justify-content:center">
      <button id="timer-btn" onclick="toggleTimer()" style="font-size:11px;font-weight:600;padding:5px 14px;border-radius:100px;border:1.5px solid rgba(0,0,0,.1);background:transparent;color:var(--ink);cursor:pointer">⏵ démarrer</button>
      <button onclick="resetTimer()" style="font-size:11px;font-weight:600;padding:5px 14px;border-radius:100px;border:1.5px solid rgba(0,0,0,.1);background:transparent;color:var(--muted);cursor:pointer">↺</button>
    </div>
  </div>
</div>

<div class="divider"></div>

<div style="padding:36px 48px 72px;max-width:880px" id="brevet-content">
  <div style="text-align:center;padding:80px 0;color:var(--muted)">
    <div style="font-size:14px">Chargement des exercices…</div>
  </div>
</div>

<div class="footer-bar">
  <div class="footer-bar-links"><a>Instagram</a><a>Newsletter</a><a>LinkedIn</a></div>
  <span class="footer-bar-copy">© 2026 Prépa Brevet</span>
</div>

<script src="data.js"></script>
<script>

// ── Timer ───────────────────────────────────────────────────
var _s = 7200, _tot = 7200, _iv = null, _p = true;
function updateTimer() {
  var s = Math.max(0,_s), h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  var el = document.getElementById('timer-display');
  el.textContent = (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(ss<10?'0':'')+ss;
  el.style.color = _s/_tot<=.1 ? '#EF4444' : _s/_tot<=.25 ? 'var(--orange)' : 'var(--blue)';
}
function toggleTimer() {
  var btn = document.getElementById('timer-btn');
  if (_p) { _p=false; btn.textContent='⏸ pause'; _iv=setInterval(function(){ if(!_p&&_s>0){_s--;updateTimer();}else if(_s<=0){clearInterval(_iv);btn.textContent='Temps écoulé!';}},1000); }
  else { _p=true; clearInterval(_iv); btn.textContent='▶ reprendre'; }
}
function resetTimer() {
  clearInterval(_iv); _s=_tot; _p=true;
  document.getElementById('timer-btn').textContent='⏵ démarrer';
  updateTimer();
}
function setTimer(mins) {
  _s = _tot = mins * 60; updateTimer();
}

// ── Scores ──────────────────────────────────────────────────
var _scores = {}, _mode = 'question', _exercices = [];

// ── Rendu des exercices ─────────────────────────────────────
function renderExercices(exercices, mode) {
  _exercices = exercices;
  _mode = mode;
  var html = '';

  exercices.forEach(function(ex, ei) {
    var totalPts = ex.questions.reduce(function(a,q){ return a + (q.points||0); }, 0);

    html += '<div class="brevet-ex" id="ex-'+ei+'">';
    // En-tête exercice
    html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px">';
    html += '<div>';
    html += '<span class="brevet-ex-num">Exercice '+ex.numero+'</span>';
    html += '<span class="brevet-ex-titre">'+ex.titre+'</span>';
    html += '<span style="font-size:11px;font-weight:400;color:var(--muted);display:block;margin-top:4px">'+ex.source+'</span>';
    html += '</div>';
    html += '<div style="display:flex;gap:6px;align-items:center">';
    html += '<span class="ctag b">'+ex.notion+'</span>';
    html += '<span class="ctag" id="ex-score-tag-'+ei+'">'+totalPts+' pts</span>';
    html += '</div></div>';

    // Énoncé
    html += '<div class="brevet-enonce">'+ex.enonce.replace(/\n/g,'<br>')+'</div>';

    // Questions
    ex.questions.forEach(function(q, qi) {
      var isQcm = q.options && q.options.length >= 2;
      html += '<div class="brevet-q" id="q-'+ei+'-'+qi+'">';

      // ID + texte + points
      html += '<div class="brevet-q-row">';
      html += '<span class="brevet-q-id">'+q.id+'.</span>';
      html += '<span class="brevet-q-text">'+q.texte.replace(/\n/g,'<br>')+'</span>';
      if (q.points > 0) html += '<span class="brevet-q-pts" id="pts-'+ei+'-'+qi+'">'+q.points+' pt'+(q.points>1?'s':'')+'</span>';
      html += '</div>';

      // Zone de réponse
      if (q.points > 0) {
        if (isQcm) {
          var letters = ['A','B','C','D'];
          html += '<div class="qcm-options" id="qcm-'+ei+'-'+qi+'">';
          q.options.forEach(function(opt, oi) {
            var l = letters[oi] || oi;
            html += '<button class="qcm-btn" id="qcm-opt-'+ei+'-'+qi+'-'+l+'" onclick="selectQcm('+ei+','+qi+',"'+l+'")">';
            html += '<span class="qcm-btn-letter">'+l+'</span>';
            html += '<span class="qcm-btn-label">'+opt+'</span>';
            html += '</button>';
          });
          html += '</div>';
          html += '<input type="hidden" id="ans-'+ei+'-'+qi+'" value="">';
        } else {
          var placeholder = q.reponse ? q.reponse.split('\n')[0].substring(0,80)+'…' : 'Ta réponse…';
          html += '<span class="lbl">Ta réponse</span>';
          html += '<textarea class="brevet-answer" id="ans-'+ei+'-'+qi+'" rows="3" placeholder="'+placeholder.replace(/"/g,"'")+'"></textarea>';
        }
        if (mode === 'question') {
          if (isQcm) {
            html += '<button class="corr-btn" id="corr-btn-'+ei+'-'+qi+'" onclick="corrigerQuestion('+ei+','+qi+')" disabled>Corriger →</button>';
          } else {
            html += '<button class="corr-btn" id="corr-btn-'+ei+'-'+qi+'" onclick="corrigerQuestion('+ei+','+qi+')">Voir la correction →</button>';
          }
        }
      }

      html += '<div class="q-feedback" id="fb-'+ei+'-'+qi+'"></div>';
      html += '</div>'; // fin brevet-q
    });

    // Barre de score par exercice
    html += '<div class="ex-score-bar" id="ex-bar-'+ei+'" style="display:none">';
    html += '<div class="ex-score-row"><span class="ex-score-label">Score exercice '+ex.numero+'</span><span class="ex-score-val" id="ex-score-val-'+ei+'">0 / '+totalPts+' pts</span></div>';
    html += '<div class="ex-bar"><div class="ex-bar-fill" id="ex-bar-fill-'+ei+'" style="width:0%"></div></div>';
    html += '</div>';

    html += '</div>'; // fin brevet-ex
  });

  // Boutons finaux
  html += '<div style="margin-top:24px;display:flex;gap:12px;align-items:center">';
  if (mode === 'fin') {
    html += '<button class="btn btn-blue" onclick="corrigerTout()" style="font-size:14px;padding:14px 32px">Corriger mon brevet →</button>';
  } else {
    html += '<button class="btn btn-orange" onclick="rendreNote()" style="font-size:14px;padding:14px 32px">Voir ma note finale →</button>';
  }
  html += '<a class="btn btn-ghost" href="generer.html" style="font-size:13px;padding:12px 24px">← Nouveau brevet</a>';
  html += '</div>';

  // Panneau score
  html += '<div class="score-panel" id="score-panel"></div>';

  document.getElementById('brevet-content').innerHTML = html;
}

// ── QCM ────────────────────────────────────────────────────
function selectQcm(ei, qi, letter) {
  var fb = document.getElementById('fb-'+ei+'-'+qi);
  if (fb && fb.classList.contains('shown')) return;
  ['A','B','C','D'].forEach(function(l) {
    var btn = document.getElementById('qcm-opt-'+ei+'-'+qi+'-'+l);
    if (btn) btn.classList.remove('selected');
  });
  var sel = document.getElementById('qcm-opt-'+ei+'-'+qi+'-'+letter);
  if (sel) sel.classList.add('selected');
  var ans = document.getElementById('ans-'+ei+'-'+qi);
  if (ans) ans.value = letter;
  var corrBtn = document.getElementById('corr-btn-'+ei+'-'+qi);
  if (corrBtn) corrBtn.disabled = false;
}

// ── Correction question ─────────────────────────────────────
function corrigerQuestion(ei, qi) {
  var ex = _exercices[ei];
  var q  = ex.questions[qi];
  var fb = document.getElementById('fb-'+ei+'-'+qi);
  var btn = document.getElementById('corr-btn-'+ei+'-'+qi);
  if (btn) btn.style.display = 'none';

  fb.className = 'q-feedback shown';
  fb.innerHTML = '<strong>Correction :</strong><br>' + (q.reponse || '').replace(/\n/g,'<br>');
  fb.style.display = 'block';

  // Compter pts pour QCM
  if (q.options && q.options.length) {
    var ans = document.getElementById('ans-'+ei+'-'+qi);
    var val = ans ? ans.value : '';
    // Extraire la bonne réponse depuis le texte (ex: "Réponse C")
    var correctMatch = (q.reponse || '').match(/R[ée]ponse\s+([A-D])/i);
    var correct = correctMatch ? correctMatch[1].toUpperCase() : null;
    var got = correct && val.toUpperCase() === correct ? q.points : 0;
    if (!_scores[ei]) _scores[ei] = {};
    _scores[ei][qi] = { earned: got, max: q.points };
    // Colorier le bouton sélectionné
    if (correct) {
      var goodBtn = document.getElementById('qcm-opt-'+ei+'-'+qi+'-'+correct);
      if (goodBtn) goodBtn.style.borderColor = '#22C55E', goodBtn.style.background = '#F0FDF4';
    }
    if (val && val.toUpperCase() !== correct) {
      var badBtn = document.getElementById('qcm-opt-'+ei+'-'+qi+'-'+val.toUpperCase());
      if (badBtn) badBtn.style.borderColor = '#EF4444', badBtn.style.background = '#FEF2F2';
    }
  } else {
    if (!_scores[ei]) _scores[ei] = {};
    _scores[ei][qi] = { earned: q.points, max: q.points };
  }
}

// ── Corriger tout (mode fin) ────────────────────────────────
function corrigerTout() {
  _exercices.forEach(function(ex, ei) {
    ex.questions.forEach(function(q, qi) {
      if (!document.getElementById('fb-'+ei+'-'+qi).classList.contains('shown')) {
        corrigerQuestion(ei, qi);
      }
    });
  });
  rendreNote();
}

// ── Note finale ─────────────────────────────────────────────
function rendreNote() {
  // Afficher toutes les corrections d'abord
  _exercices.forEach(function(ex, ei) {
    ex.questions.forEach(function(q, qi) {
      var fb = document.getElementById('fb-'+ei+'-'+qi);
      if (!fb.classList.contains('shown')) corrigerQuestion(ei, qi);
    });
  });

  // Calculer scores
  var totalMax = 0, totalEarned = 0;
  var scoresParEx = [];

  _exercices.forEach(function(ex, ei) {
    var exMax = ex.questions.reduce(function(a,q){ return a+(q.points||0); },0);
    var exEarned = 0;
    ex.questions.forEach(function(q, qi) {
      var sc = (_scores[ei] && _scores[ei][qi]) ? _scores[ei][qi] : { earned: q.points, max: q.points };
      exEarned += sc.earned;
    });
    totalMax += exMax;
    totalEarned += exEarned;
    scoresParEx.push({ nom: ex.titre, earned: exEarned, max: exMax });

    // Afficher barre exercice
    var bar = document.getElementById('ex-bar-'+ei);
    var barFill = document.getElementById('ex-bar-fill-'+ei);
    var barVal = document.getElementById('ex-score-val-'+ei);
    if (bar) bar.style.display = 'block';
    if (barVal) barVal.textContent = exEarned+' / '+exMax+' pts';
    if (barFill) setTimeout(function(){ barFill.style.width = (exMax?Math.round(exEarned/exMax*100):0)+'%'; }, 100);
  });

  var note = totalMax > 0 ? Math.round((totalEarned / totalMax) * 200) / 10 : 0;
  var mention = note >= 18 ? 'Félicitations' : note >= 16 ? 'Très bien' : note >= 14 ? 'Bien' : note >= 12 ? 'Assez bien' : note >= 10 ? 'Admis' : 'À retravailler';
  var mentionColors = {
    'Félicitations':  {bg:'#F9F0F7',color:'#8B5A7A'},
    'Très bien':      {bg:'#FFF0E8',color:'var(--orange)'},
    'Bien':           {bg:'#EEF2FF',color:'var(--blue)'},
    'Assez bien':     {bg:'rgba(189,212,231,.3)',color:'#5a7a9a'},
    'Admis':          {bg:'rgba(0,0,0,.06)',color:'var(--muted)'},
    'À retravailler': {bg:'#FEF2F2',color:'#991B1B'}
  };
  var mc = mentionColors[mention] || mentionColors['Admis'];

  var barsHtml = scoresParEx.map(function(e) {
    var pct = e.max > 0 ? Math.round(e.earned/e.max*100) : 0;
    return '<div class="score-ex-row"><span class="score-ex-name">'+e.nom.substring(0,14)+'</span><div class="score-ex-bar"><div class="score-ex-fill" style="width:'+pct+'%"></div></div><span class="score-ex-pts">'+e.earned+'/'+e.max+'</span></div>';
  }).join('');

  var panel = document.getElementById('score-panel');
  panel.style.display = 'block';
  panel.innerHTML = '<div class="score-panel-inner">'
    +'<div><div class="score-note">Ta note finale</div>'
    +'<div class="score-big">'+note.toString().replace('.',',')+' <span style="font-size:28px;font-weight:400;opacity:.5">/20</span></div>'
    +'<div><span class="score-mention" style="background:'+mc.bg+';color:'+mc.color+'">'+mention+'</span></div>'
    +'<div style="margin-top:16px;font-size:13px;color:rgba(255,255,255,.5)">'+totalEarned+' pts sur '+totalMax+' au total</div>'
    +'</div>'
    +'<div><div style="font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:16px">détail par exercice</div>'
    +'<div class="score-bars">'+barsHtml+'</div>'
    +'<button onclick="location.href=\'generer.html\'" style="margin-top:24px;width:100%;font-size:13px;font-weight:600;padding:13px;border-radius:100px;border:none;cursor:pointer;background:rgba(255,255,255,.15);color:#fff">← Nouveau brevet</button>'
    +'</div></div>';

  panel.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Sauvegarder en localStorage
  var sessions = JSON.parse(localStorage.getItem('brevet_sessions') || '[]');
  sessions.unshift({
    date: new Date().toLocaleDateString('fr-FR', {day:'numeric',month:'short',year:'numeric'}),
    note: note, mention: mention,
    notions: _exercices.map(function(e){return e.notion;}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(', '),
    scoresParEx: scoresParEx, conseils: []
  });
  if (sessions.length > 20) sessions = sessions.slice(0, 20);
  localStorage.setItem('brevet_sessions', JSON.stringify(sessions));
}

// ── Init ────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  var raw = sessionStorage.getItem('brevet_config');
  if (!raw) { window.location.href = 'generer.html'; return; }

  var config = JSON.parse(raw);
  _mode = config.mode || 'question';

  // Afficher durée et notions
  document.getElementById('brevet-duree').textContent = config.duree || '2h';
  document.getElementById('brevet-notions').textContent =
    config.notions === 'all' ? 'Toutes les notions' : (config.notions || []).join(' · ');

  // Timer
  var mins = config.duree === '2h' ? 120 : config.duree === '1h30' ? 90 :
             config.duree === '1h' ? 60 : config.duree === '30 min' ? 30 : 10;
  setTimer(mins);

  // Exercices
  var exercices = config.exercices || [];
  if (!exercices.length) { window.location.href = 'generer.html'; return; }
  renderExercices(exercices, _mode);
});

</script>
</body>
</html>
